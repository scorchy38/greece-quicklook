[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "greece-tools"
version = "1.3.0"
description = "Command-line helpers for Greece: render previews and thumbnails in CI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Greece Team", email = "team@example.com" }]
dependencies = [
  "click>=8.1",
  "pillow>=10.4,<12",
  "rich~=13.9",
  "httpx[http2]>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
greece-render = "greece_tools.cli:render"
greece-thumb = "greece_tools.cli:thumbnail"

[project.urls]
Homepage = "https://greece.example.com/tools"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
