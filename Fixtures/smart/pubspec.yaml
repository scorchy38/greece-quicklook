version: 1.6.0+42
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.3.0
  riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_markdown: ^0.7.4
  shared_preferences: ^2.3.2
  greece_protocol:
