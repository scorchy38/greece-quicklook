name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: |
          pnpm test -- --coverage
          pnpm typecheck

  build:
    name: Build app
    needs: [lint, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild -scheme Greece -configuration Release build
      - uses: actions/upload-artifact@v4
        with:
          name: Greece.app
          path: build/Release/Greece.app

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    environment: production
    steps:
      - uses: actions/download-artifact@v4
      - name: Notarize and publish
        run: ./scripts/release.sh
