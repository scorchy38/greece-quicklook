    { name = "anyio" },
    { name = "certifi" },
]

[[package]]
name = "anyio"
version = "4.6.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "certifi"
version = "2024.8.30"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.7.1"
source = { registry = "https://pypi.org/simple" }
