name: Greece
options:
  bundleIdPrefix: com.scorchy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ZHCT595PYJ
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    # zlib + bzip2 module map, used privately by GreeceKit's archive readers.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/GreeceKit/CArchive

targets:

  # Shared rendering engine: detection, parsers, native + web renderers, bundled web assets.
  GreeceKit:
    type: framework
    platform: macOS
    sources:
      - path: GreeceKit/Sources
      - path: GreeceKit/Resources/Web
        type: folder
        buildPhase: resources
      - path: GreeceKit/Resources/Licenses
        type: folder
        buildPhase: resources
      - path: GreeceKit/Resources/Samples
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.kit
        PRODUCT_NAME: GreeceKit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        OTHER_LDFLAGS: ["-lz", "-lbz2"]

  # Quick Look preview extension. Thin: hands every file to GreeceKit.
  GreeceQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: GreeceQuickLook
    dependencies:
      - target: GreeceKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook
        PRODUCT_NAME: GreeceQuickLook
        INFOPLIST_FILE: GreeceQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: GreeceQuickLook/GreeceQuickLook.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  # The companion app: onboarding, live-preview settings, sample files.
  # Finder thumbnails: miniature pages of Markdown, code and tables.
  GreeceThumbnails:
    type: app-extension
    platform: macOS
    sources:
      - path: GreeceThumbnails
    dependencies:
      - target: GreeceKit
        embed: false
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.thumbnails
        PRODUCT_NAME: GreeceThumbnails
        INFOPLIST_FILE: GreeceThumbnails/Info.plist
        CODE_SIGN_ENTITLEMENTS: GreeceThumbnails/GreeceThumbnails.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  Greece:
    type: application
    platform: macOS
    sources:
      - path: Greece
    dependencies:
      - target: GreeceKit
      - target: GreeceQuickLook
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceThumbnails
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece
        PRODUCT_NAME: Greece
        INFOPLIST_FILE: Greece/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Greece/App/Greece.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  GreeceKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GreeceKitTests
    dependencies:
      - target: GreeceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.tests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/../Frameworks", "@executable_path/../Frameworks"]

schemes:
  Greece:
    build:
      targets:
        Greece: all
        GreeceKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GreeceKitTests
    archive:
      config: Release
