name: Greece
options:
  bundleIdPrefix: com.scorchy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ZHCT595PYJ
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    # zlib + bzip2 module map, used privately by GreeceKit's archive readers.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/GreeceKit/CArchive

targetTemplates:
  # A Quick Look preview extension. Thin: hands every file to GreeceKit. Greece ships one per
  # family of formats (Types/families.json) so each can be turned off and handed back to macOS.
  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: GreeceQuickLook
        excludes:
          - "Info.plist"
          - "Families/**"
    dependencies:
      - target: GreeceKit
        embed: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: GreeceQuickLook/GreeceQuickLook.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

targets:

  # Shared rendering engine: detection, parsers, native + web renderers, bundled web assets.
  GreeceKit:
    type: framework
    platform: macOS
    sources:
      - path: GreeceKit/Sources
      - path: GreeceKit/Resources/Web
        type: folder
        buildPhase: resources
      - path: GreeceKit/Resources/Licenses
        type: folder
        buildPhase: resources
      - path: GreeceKit/Resources/Samples
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.kit
        PRODUCT_NAME: GreeceKit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        OTHER_LDFLAGS: ["-lz", "-lbz2", "-larchive"]

  # Quick Look previews: Code & Text.
  GreeceQuickLook:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook
        PRODUCT_NAME: GreeceQuickLook
        INFOPLIST_FILE: GreeceQuickLook/Info.plist

  # Quick Look previews: Markdown & Documents.
  GreeceDocuments:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.documents
        PRODUCT_NAME: GreeceDocuments
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceDocuments/Info.plist

  # Quick Look previews: Data & Tables.
  GreeceData:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.data
        PRODUCT_NAME: GreeceData
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceData/Info.plist

  # Quick Look previews: Archives & Folders.
  GreeceArchives:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.archives
        PRODUCT_NAME: GreeceArchives
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceArchives/Info.plist

  # Quick Look previews: Apps & Installers.
  GreeceApps:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.apps
        PRODUCT_NAME: GreeceApps
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceApps/Info.plist

  # Quick Look previews: 3D Models.
  GreeceModels:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.models
        PRODUCT_NAME: GreeceModels
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceModels/Info.plist

  # Quick Look previews: Maps.
  GreeceMaps:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.maps
        PRODUCT_NAME: GreeceMaps
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceMaps/Info.plist

  # Quick Look previews: Fonts & Media.
  GreeceMedia:
    templates: [PreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.quicklook.media
        PRODUCT_NAME: GreeceMedia
        INFOPLIST_FILE: GreeceQuickLook/Families/GreeceMedia/Info.plist

  # The companion app: onboarding, live-preview settings, sample files.
  # Finder thumbnails: miniature pages of Markdown, code and tables.
  GreeceThumbnails:
    type: app-extension
    platform: macOS
    sources:
      - path: GreeceThumbnails
    dependencies:
      - target: GreeceKit
        embed: false
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.thumbnails
        PRODUCT_NAME: GreeceThumbnails
        INFOPLIST_FILE: GreeceThumbnails/Info.plist
        CODE_SIGN_ENTITLEMENTS: GreeceThumbnails/GreeceThumbnails.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  Greece:
    type: application
    platform: macOS
    sources:
      - path: Greece
    dependencies:
      - target: GreeceKit
      - target: GreeceQuickLook
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceDocuments
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceData
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceArchives
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceApps
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceModels
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceMaps
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceMedia
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - target: GreeceThumbnails
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece
        PRODUCT_NAME: Greece
        INFOPLIST_FILE: Greece/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Greece/App/Greece.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  GreeceKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GreeceKitTests
    dependencies:
      - target: GreeceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorchy.greece.tests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/../Frameworks", "@executable_path/../Frameworks"]

schemes:
  Greece:
    build:
      targets:
        Greece: all
        GreeceKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GreeceKitTests
    archive:
      config: Release
